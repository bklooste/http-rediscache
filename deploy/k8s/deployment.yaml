# Node-agnostic on purpose: no nodeSelector, no affinity, no tolerations. The pod runs on any node
# that can reach its dependencies over the network. Redis is an external endpoint, not a node pin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-rediscache
spec:
  replicas: 2
  selector:
    matchLabels: { app: http-rediscache }
  template:
    metadata:
      labels: { app: http-rediscache }
    spec:
      containers:
        - name: cache
          image: ghcr.io/bklooste/http-rediscache/cache:0.1   # pin an explicit version
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Redis        # the only required setting; the rest default sensibly
              value: redis.default.svc:6379,abortConnect=false   # your Redis
            # - { name: Cache__KeyPrefix, value: "prod:" }       # one per environment if they share a Redis
            # Secrets: mount a Secret and point at it instead of a plain value —
            # - { name: ConnectionStrings__Redis_FILE, value: /secrets/redis }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: http-rediscache
spec:
  selector: { app: http-rediscache }
  ports:
    - port: 80
      targetPort: 8080
