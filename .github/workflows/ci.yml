name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/cache

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nbgv needs full history for the height-based version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore HttpRedisCache.slnx
      - run: dotnet build HttpRedisCache.slnx -c Release --no-restore
      - name: Test
        run: >
          dotnet test HttpRedisCache.slnx -c Release --no-build
          --filter "TestType!=PerfTest"
          --logger trx --results-directory TestResults
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      # Container smoke test: the built image must start and report healthy before it can be published.
      - name: Build image
        run: docker build -t smoke:ci .
      # The image must start with nothing but a Redis connection string (every other setting has a default).
      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name smoke-redis --network smoke redis:7-alpine
          docker run -d --name smoke --network smoke -p 8080:8080 -e ConnectionStrings__Redis=smoke-redis:6379 smoke:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write        # tag + release
      packages: write        # push to GHCR with GITHUB_TOKEN — no stored PAT
      id-token: write        # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version (Nerdbank.GitVersioning)
        id: nbgv
        uses: dotnet/nbgv@v0.4
        with:
          setAllVars: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          v="${{ steps.nbgv.outputs.SimpleVersion }}"
          minor="${v%.*}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$v"
            echo "$IMAGE:$minor"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.nbgv.outputs.SimpleVersion }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Verify the package is anonymously pullable (public). Fails the first publish if visibility
      # was not switched to public — a one-time manual step per package in GitHub package settings.
      - name: Verify anonymous pull
        run: |
          docker logout ghcr.io
          docker pull "$IMAGE:${{ steps.nbgv.outputs.SimpleVersion }}"

      - name: Generate SBOM + NOTICE inventory
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.nbgv.outputs.SimpleVersion }}" \
            --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json

      - name: Tag release
        run: |
          tag="v${{ steps.nbgv.outputs.SimpleVersion }}"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.nbgv.outputs.SimpleVersion }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping"
          else
            gh release create "$tag" sbom.spdx.json --title "$tag" --generate-notes
          fi
